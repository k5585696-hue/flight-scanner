name: 機票掃描

on:
  schedule:
    - cron: "7 * * * *"   # 每小時第 7 分執行（GitHub 尖峰時可能延遲幾分鐘）
  push:                    # 在網頁上改航線（routes.json）或改 config.toml 後，馬上掃一次
    paths:
      - routes.json
      - config.toml
  workflow_dispatch:       # 也可以在 Actions 頁面手動按 Run workflow
    inputs:
      test_email:
        description: "順便寄一封測試信，確認 Email 設定"
        type: boolean
        default: false

permissions:
  contents: write   # 把價格紀錄存回 repo
  pages: write      # 發布網頁
  id-token: write

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}   # 取分支最新版本（含前一次掃描存的紀錄），連續存檔時才不會衝突

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 掃描機票
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_EMAIL: ${{ inputs.test_email }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scanner.py

      # 就算寄信失敗，價格紀錄和網頁還是照樣更新
      - name: 儲存價格紀錄
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "價格紀錄 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}

      - uses: actions/upload-pages-artifact@v4
        if: ${{ !cancelled() }}
        with:
          path: _site

      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
