# ==========================================================
#  機票雷達 設定檔 —— 想追蹤哪些機票，改這個檔案就好
# ==========================================================
# 在 GitHub 網頁上按鉛筆圖示直接編輯 → Commit，下一次整點掃描就會用新設定。

currency = "TWD"        # 幣別
language = "zh-TW"      # 航空公司名稱顯示的語言
pause_seconds = 1.5     # 每筆查詢之間休息幾秒（太快可能被 Google 擋）

[alert]
drop_percent    = 15    # 比「平常價」便宜超過幾 % 就寄信
usual_days      = 14    # 「平常價」= 同一個出發日，過去幾天查到的價格中位數
min_samples     = 24    # 至少累積幾筆紀錄才開始比較（每小時 1 筆，24 = 先觀察 1 天）
realert_percent = 3     # 同一個日期寄過信後，要再降幾 % 才會再寄（避免重複寄）

# 廉航托運行李費（每件、單程、新台幣）。Google 沒有廉航行李費資料，程式內建的是估計值，
# 想改成官網實際價格就把那一行前面的 # 拿掉再改數字；沒列出的航空公司視為票價已含行李。
[bag_fees]
# IT = 900    # 台灣虎航
# TR = 1100   # 酷航
# MM = 800    # 樂桃
# GK = 900    # 捷星日本
# 7C = 900    # 濟州航空
# VJ = 800    # 越捷
# AK = 1000   # 亞洲航空

# ----------------------------------------------------------
#  航線：建議直接在網頁上按「＋ 新增追蹤」設定，比較方便。
#  在網頁上存過一次之後，就改用 routes.json，下面的 [[routes]] 不再使用。
#  每一段 [[routes]] 是一組要追蹤的行程，可以複製很多段
# ----------------------------------------------------------
# from / to    機場或城市代碼（城市代碼會一次查該城市所有機場）
#              TPE 桃園  TSA 松山  RMQ 台中  KHH 高雄
#              TYO 東京(成田+羽田)  OSA 大阪  OKA 沖繩  FUK 福岡  CTS 札幌
#              SEL 首爾  PUS 釜山  HKG 香港  BKK 曼谷  SIN 新加坡
# trip         "round-trip" 來回、"one-way" 單程
# depart       出發日期：單日 "2026-12-15"，或區間 "2026-12-10..2026-12-20"，可列多個
# stay_days    來回票要玩幾天，可列多個，例如 [4, 5]（單程不用寫）
# adults       幾位大人（價格是所有人的總價）
# children     幾位小孩（2～11 歲，不寫 = 0）
# infants      幾位嬰兒（未滿 2 歲、坐大人腿上，不寫 = 0）
# checked_bags 整團總共要托運幾件行李（廉航會加上估計行李費，不寫 = 0）
# depart_hours 去程出發時段，例如 [6, 12] = 6:00～12:59 起飛（不寫 = 不限）
# paused       true = 暫停這條航線
# max_stops    最多轉機幾次：0 = 只要直飛；不寫 = 不限
# alert_below  低於這個價格一定寄信，不管平常價（不寫 = 不使用）
#
# 每次掃描的查詢數 = 出發日數 × stay_days 個數，建議全部加起來不要超過 50 筆。

[[routes]]
name        = "台北 → 東京 12月"
from        = "TPE"
to          = "TYO"
trip        = "round-trip"
depart      = ["2026-12-10..2026-12-16"]
stay_days   = [5]
adults      = 1
max_stops   = 0
alert_below = 7000

[[routes]]
name   = "台北 → 大阪 春節單程"
from   = "TPE"
to     = "OSA"
trip   = "one-way"
depart = ["2027-02-04..2027-02-07"]
adults = 1
